<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>MyFolds · macOS 原生文件管理器</title><link rel="icon" href="assets/myfolds.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="settings.css"></head>
<body>
<div class="desktop-ambient" aria-hidden="true"></div>
<header class="review-header"><a class="proposal-brand" href="index.html" aria-label="MyFolds 设计原型"><img src="assets/myfolds.svg" alt="" class="brand-icon"><strong>MyFolds</strong><span>文件管理器</span></a><div class="review-actions"><span class="demo-label">macOS 27 · 设计预览</span><button class="background-toggle" id="background-toggle" popovertarget="background-panel" aria-label="预览背景" aria-expanded="false" title="预览背景"><span class="background-swatch" aria-hidden="true"></span><span>背景</span><span data-icon="chevronDown"></span></button><button class="appearance-control" id="theme-button" data-action="theme" aria-label="切换深色外观" title="切换深色外观"><span data-icon="moon"></span></button><button class="appearance-control" id="transparency-button" data-action="transparency" aria-label="减少透明度" aria-pressed="false" title="减少透明度"><span data-icon="transparency"></span></button><a class="text-link" href="design.html">设计说明 <span data-icon="arrowUpRight"></span></a></div></header>
<section class="preview-background-panel" id="background-panel" popover aria-label="预览背景设置">
  <h2>预览背景</h2>
  <div class="background-modes" role="group" aria-label="背景模式"><button type="button" data-background-mode="warm" aria-pressed="false">暖色壁纸</button><button type="button" data-background-mode="rgb" aria-pressed="true">RGB 色彩</button></div>
  <div class="background-rgb-controls" id="background-rgb-controls">
    <div class="background-playback"><button type="button" id="background-play"><span data-icon="pause"></span><span id="background-play-label">暂停流动</span></button><span id="background-motion-status">36 秒一轮</span></div>
    <div class="background-presets" role="group" aria-label="固定背景色"><button type="button" data-background-colour="218,151,166" aria-label="红色背景"><i style="--swatch:#da97a6"></i>红</button><button type="button" data-background-colour="151,187,160" aria-label="绿色背景"><i style="--swatch:#97bba0"></i>绿</button><button type="button" data-background-colour="146,169,211" aria-label="蓝色背景"><i style="--swatch:#92a9d3"></i>蓝</button></div>
    <label class="background-channel" style="--channel:#b44a4a"><span>R</span><input id="background-r" type="range" min="0" max="255" step="1" value="218" aria-label="背景红色通道"><output for="background-r" id="background-r-value" aria-live="off">218</output></label>
    <label class="background-channel" style="--channel:#377b4d"><span>G</span><input id="background-g" type="range" min="0" max="255" step="1" value="151" aria-label="背景绿色通道"><output for="background-g" id="background-g-value" aria-live="off">151</output></label>
    <label class="background-channel" style="--channel:#356fb2"><span>B</span><input id="background-b" type="range" min="0" max="255" step="1" value="166" aria-label="背景蓝色通道"><output for="background-b" id="background-b-value" aria-live="off">166</output></label>
  </div>
  <p>只改变预览桌面，文件内容保持原色。</p>
</section>
<main>
<section class="app-window" aria-label="MyFolds 文件管理器设计预览">
<div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app-body">
<aside class="sidebar" aria-label="常用位置"><div class="sidebar-cap"></div><div class="sidebar-scroll">
          <div class="sidebar-group"><p class="sidebar-title">个人收藏</p>
            <button class="nav-item" data-folder="/Users/demo/Recent"><span data-icon="clock"></span><span>最近使用</span></button>
            <button class="nav-item" data-folder="/Users/demo/Desktop"><span data-icon="desktop"></span><span>桌面</span></button>
            <button class="nav-item" data-folder="/Users/demo/Downloads"><span data-icon="download"></span><span>下载</span></button>
            <button class="nav-item" data-folder="/Users/demo/Documents"><span data-icon="document"></span><span>文稿</span></button>
            <button class="nav-item" data-folder="/Users/demo/Pictures"><span data-icon="image"></span><span>图片</span></button>
          </div>
          <div class="sidebar-group"><p class="sidebar-title">工作位置</p>
            <button class="nav-item active" data-folder="/Users/demo/Pictures/旅途精选"><span data-icon="folderStar"></span><span>旅途精选</span></button>
            <button class="nav-item" data-folder="/Users/demo/Pictures/旅途精选/导出"><span data-icon="folder"></span><span>导出</span></button>
            <button class="nav-item" data-folder="/Users/demo/Projects"><span data-icon="code"></span><span>项目文件</span></button>
          </div>
          <div class="sidebar-group"><p class="sidebar-title">位置</p>
            <button class="nav-item" data-folder="/"><span data-icon="drive"></span><span>Macintosh HD</span></button>
            <button class="nav-item" id="external-device" data-folder="/Volumes/工作硬盘"><span data-icon="external"></span><span>工作硬盘</span><span class="device-dot" aria-hidden="true"></span><small class="device-state" hidden>离线</small></button>
          </div>
          <div class="sidebar-bottom"><button class="nav-item" data-action="trash-view"><span data-icon="trash"></span><span>废纸篓</span></button><button class="nav-item" data-action="settings"><span data-icon="settings"></span><span>偏好设置</span></button><div class="storage-summary"><div><span>演示磁盘</span><span>可用 256 GB</span></div><div class="storage-meter"><i></i></div></div></div>
        </div></aside>
<div class="workspace">
<header class="window-bar">
  <div class="toolbar-title"><button class="icon-button sidebar-control" data-action="sidebar-toggle" aria-label="显示或隐藏侧栏" title="显示或隐藏侧栏"><span data-icon="sidebarLeft"></span></button><div class="navigation-buttons"><button class="icon-button" id="back-button" data-action="back" aria-label="后退" title="后退"><span data-icon="chevronLeft"></span></button><button class="icon-button" data-action="up" aria-label="上一级" title="上一级 ⌘↑"><span data-icon="arrowUp"></span></button></div><div><h1 id="window-folder-title">旅途精选</h1><span id="window-folder-subtitle">MyFolds</span></div></div>
  <div class="native-toolbar">
    <div class="glass-group file-actions" role="group" aria-label="文件操作">
      <button class="icon-button" id="cut-button" data-action="cut" aria-label="剪切" title="剪切 ⌘X"><span data-icon="scissors"></span></button>
      <button class="icon-button" id="copy-button" data-action="copy" aria-label="复制" title="复制 ⌘C"><span data-icon="copy"></span></button>
      <button class="icon-button" id="paste-button" data-action="paste" aria-label="粘贴" title="粘贴 ⌘V" disabled><span data-icon="clipboard"></span></button>
    </div>
    <div class="glass-group view-group" role="group" aria-label="文件视图"><button class="icon-button" id="list-button" data-action="list" aria-label="列表视图" aria-pressed="true" title="列表视图"><span data-icon="list"></span></button><button class="icon-button" id="grid-button" data-action="grid" aria-label="图标视图" aria-pressed="false" title="图标视图"><span data-icon="grid"></span></button><button class="icon-button" data-action="sort" aria-label="排序方式" title="排序方式"><span data-icon="sort"></span></button></div>
    <div class="glass-group layout-group"><button class="icon-button" id="split-button" data-action="split" aria-label="双栏浏览" aria-pressed="false" title="双栏浏览"><span data-icon="columns"></span></button><button class="icon-button" id="preview-button" data-action="preview-toggle" aria-label="显示或隐藏预览区" aria-pressed="false" title="显示或隐藏预览区"><span data-icon="sidebarRight"></span></button></div>
    <button class="icon-button glass-circle" id="more-button" data-action="more" aria-label="更多文件操作" title="更多操作"><span data-icon="more"></span></button>
<label class="search-field"><span data-icon="search"></span><input id="search-input" placeholder="搜索此文件夹" aria-label="搜索当前文件夹"><kbd>⌘ F</kbd></label>
  </div>
</header>
<div class="tabs-row" id="tabs-row" hidden><div class="tabs" role="tablist" aria-label="打开的文件夹"></div><button class="icon-button add-tab" aria-label="打开新标签页" title="打开新标签页 ⌘T" data-action="new-tab"><span data-icon="plus"></span></button></div>
<div class="content-area" id="content-area">
            <div class="browser-zone" id="browser-zone">
              <div class="file-panes" id="file-panes"><section class="file-pane active-pane" id="main-pane" aria-label="文件浏览区"></section><section class="file-pane target-pane" id="target-pane" aria-label="右侧文件浏览区" hidden></section></div>
              <div class="clipboard-shelf" id="clipboard-shelf" hidden></div>
              <div class="task-shelf" id="task-shelf" aria-live="polite" hidden></div>
            </div>
            <aside class="inspector" id="inspector" aria-label="所选文件预览"></aside>
          </div>
          <footer class="status-bar"><div class="path-bar">            <div class="address-wrap" id="address-wrap">
              <button class="address-display" id="address-display" data-action="edit-path" aria-label="编辑当前路径，快捷键 Command L"><span data-icon="folder"></span><span id="path-text"></span><kbd>⌘L</kbd></button>
              <form class="address-form" id="address-form" hidden><span data-icon="folder"></span><input id="path-input" aria-label="文件或文件夹路径" autocomplete="off" spellcheck="false"><button class="icon-button" type="submit" aria-label="前往路径"><span data-icon="arrowRight"></span></button></form>
              <div class="path-suggestions" id="path-suggestions" hidden></div>
            </div>
            <button class="icon-button copy-path" data-action="copy-path" aria-label="复制当前完整路径" title="复制当前完整路径"><span data-icon="copy"></span></button>
</div><div class="status-summary"><span id="status-text"></span><span class="status-dot"></span><span id="status-right"></span><button class="status-task-button" data-action="tasks" title="文件任务"><span data-icon="activity"></span><span id="task-count">任务</span></button></div></footer>
</div></div>
<div class="popover" id="popover" hidden></div><div class="toast" id="toast" role="status" hidden></div>
</section>
<section class="scenario-strip" aria-label="设计场景演示"><div class="scenario-buttons"><button class="scenario-button active" data-scene="browse">浏览</button><button class="scenario-button" data-scene="path">路径</button><button class="scenario-button" data-scene="move">移动文件</button><button class="scenario-button" data-scene="media">媒体预览</button><button class="scenario-button" data-scene="open">打开方式</button><button class="scenario-button" data-scene="archive">压缩包</button><button class="scenario-button" data-scene="states">异常状态</button></div><div class="scenario-description"><strong id="scenario-title">你的文件，井然有序。</strong><p id="scenario-description">完整路径就在底部。空格预览，⌘X / ⌘C / ⌘V 整理文件。</p></div></section>
</main><footer class="review-footer"><span>交互原型 · 全部为示例数据 · 玻璃效果为网页模拟</span><button class="text-link" data-action="reset">重置演示 <span data-icon="refresh"></span></button></footer><dialog id="dialog" aria-labelledby="dialog-title"></dialog><dialog id="settings-window" aria-label="MyFolds 设置" aria-modal="false"></dialog><script src="app.js"></script><script src="settings.js"></script><script src="preview-background.js"></script></body></html>
